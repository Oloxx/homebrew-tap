name: Actualizar y probar

# Cada seis horas mira si hay release nueva de Oloxx/drop; a mano con
# "Run workflow"; y en cada push, para probar la formula tal como esta.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    name: Formula al dia
    if: github.event_name != 'push'
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      # Verifica la firma del SHA256SUMS antes de escribir un solo hash.
      - run: node scripts/update.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit si ha cambiado
        id: commit
        run: |
          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "drop $(cat .version)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Instalar de verdad, con el brew del runner, lo que haya en main tras el
  # update. `brew test` ejecuta `drop --version`.
  test:
    name: brew install (${{ matrix.os }})
    needs: update
    # En schedule solo instala si hubo cambio real de version, para no contar
    # descargas falsas en la release de Oloxx/drop cuatro veces al dia.
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.update.result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' && needs.update.result == 'success') ||
        (needs.update.result == 'success' && needs.update.outputs.changed == 'true')
      )
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: brew install oloxx/tap/drop
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap oloxx/tap "$GITHUB_WORKSPACE"
          brew install oloxx/tap/drop
          brew test oloxx/tap/drop
          drop --version
          drop --help > /dev/null
          # Instalado por Homebrew, `drop update` no se toca: manda a brew.
          drop update | tee update.log
          grep -q "brew upgrade drop" update.log
